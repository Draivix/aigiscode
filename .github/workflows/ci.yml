name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.77.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run fmt check
        run: cargo fmt --check

      - name: Run tests
        run: cargo test

      - name: Verify native CLI
        run: cargo run --quiet --bin aigiscode -- --version

  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install and build website
        working-directory: website
        run: |
          npm ci
          npm run build
